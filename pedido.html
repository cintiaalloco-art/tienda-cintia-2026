<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pedido — Obras hechas con Amor</title>
<!-- La función netlify/edge-functions/pedido.js reemplaza estos datos con la gorra elegida,
     así WhatsApp muestra su foto en miniatura en la vista previa del link. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Pedido — Obras hechas con Amor">
<meta property="og:description" content="Gorras decoradas a mano por Cintia Alloco">
<meta property="og:image" content="https://obrashechasconamor.com.ar/images/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Parisienne&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF3F0;--ink:#3B2A2C;--ink-soft:#7A5C5F;--rose:#C98A95;--deep:#A85D6B;--line:#ECD9D9}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Jost',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.brand{text-align:center;text-decoration:none;color:inherit;display:block}
.brand .name{font-family:'Parisienne',cursive;font-size:2rem;line-height:1}
.brand .by{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
h1{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:500;font-size:1.7rem;text-align:center;margin:26px 0 4px}
.sub{text-align:center;color:var(--ink-soft);font-size:.9rem;margin:0 0 20px}
.item{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 8px 20px -18px rgba(59,42,44,.5)}
.item img{width:96px;height:96px;object-fit:cover;border-radius:12px;flex-shrink:0;background:var(--line)}
.info{flex:1;min-width:0}
.num{display:inline-block;background:var(--ink);color:var(--cream);font-family:'Parisienne',cursive;font-size:.95rem;padding:1px 10px 3px;border-radius:2px;margin-bottom:4px}
.nm{font-family:'Bodoni Moda',serif;font-weight:600;font-size:1.02rem;line-height:1.25}
.meta{font-size:.8rem;color:var(--ink-soft);margin-top:2px}
.price{font-weight:700;color:var(--deep);margin-top:4px}
.sold{display:inline-block;background:var(--deep);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:6px;padding:16px 4px;font-weight:700;font-size:1.15rem}
.total span:last-child{color:var(--deep)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.btn{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:30px;font-weight:700}
.btn-wa{background:#25D366;color:#fff}
.btn-sec{border:1px solid var(--ink);color:var(--ink);background:#fff}
.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;line-height:1.6}
.note{text-align:center;font-size:.78rem;color:var(--ink-soft);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/"><div class="name">Obras hechas con Amor</div><div class="by">por Cintia Alloco</div></a>
  <h1 id="titulo">Pedido</h1>
  <p class="sub" id="sub">Cargando…</p>
  <div id="lista"></div>
  <div id="pie"></div>
</div>
<script>
const WA_NUM='543468598805';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function precioNum(p){const d=String(p||'').replace(/\D/g,'');return d?parseInt(d,10):0}
function fmt(n){return '$'+n.toLocaleString('es-AR')}
function precioTexto(p){const n=precioNum(p);return n?fmt(n):(p||'')}
function numTexto(p){return 'Nº'+String(p.numero||'').replace(/^N/,'')}
const nums=(new URLSearchParams(location.search).get('n')||'').split(',').map(s=>s.trim()).filter(Boolean);
fetch('data/productos.json?v='+Date.now()).then(r=>r.json()).then(data=>{
  const items=nums.map(n=>(data.productos||[]).find(p=>p.numero===n)).filter(Boolean);
  if(!items.length){
    document.getElementById('sub').textContent='';
    document.getElementById('lista').innerHTML='<div class="empty">No se encontraron gorras en este pedido.<br>Puede que el link esté incompleto.</div>';
    document.getElementById('pie').innerHTML='<div class="btns"><a class="btn btn-sec" href="/">Ver la tienda</a></div>';
    return;
  }
  document.getElementById('titulo').textContent=items.length===1?'Gorra elegida':'Pedido de '+items.length+' gorras';
  document.getElementById('sub').textContent='Hechas a mano, una por una ✨';
  document.getElementById('lista').innerHTML=items.map(p=>`
    <a class="item" href="/?g=${encodeURIComponent(p.numero)}">
      <img src="${esc((p.fotos||[])[0]||'images/hero.jpg')}" alt="${esc(p.nombre)}">
      <div class="info">
        <span class="num">${esc(numTexto(p))}</span>${p.vendida?'<span class="sold">Vendida</span>':''}
        <div class="nm">${esc(p.nombre)}</div>
        <div class="meta">${esc(p.categoria||'')}${p.descripcion?' · '+esc(p.descripcion):''}</div>
        <div class="price">${esc(precioTexto(p.precio))}</div>
      </div>
    </a>`).join('');
  const total=items.reduce((s,p)=>s+precioNum(p.precio),0);
  const waText='Hola Cintia! Te escribo por este pedido: '+location.href;
  document.getElementById('pie').innerHTML=`
    <div class="total"><span>Total</span><span>${fmt(total)}</span></div>
    <div class="btns">
      <a class="btn btn-wa" href="https://wa.me/${WA_NUM}?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener">💬 Escribir a Cintia</a>
      <a class="btn btn-sec" href="/">Ver más gorras</a>
    </div>
    <p class="note">Tocá una gorra para ver todas sus fotos. El envío y la forma de pago se coordinan por WhatsApp.</p>`;
}).catch(()=>{document.getElementById('sub').textContent='No se pudo cargar el pedido. Revisá tu conexión.'});
</script>
</body>
</html>
