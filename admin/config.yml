backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "images"
public_folder: "images"

collections:
  - name: "productos"
    label: "CatÃ¡logo antiguo"
    label_singular: "Gorra (antigua)"
