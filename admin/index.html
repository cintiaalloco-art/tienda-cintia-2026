<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel - Obras hechas con Amor</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  <script>
    var CatalogoPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var productos = entry.getIn(['data', 'productos']);
        if (!productos) return h('div', {}, 'Sin productos');
        return h('div', { style: { fontFamily: 'sans-serif', padding: '10px' } },
          productos.map(function(p, i) {
            var foto = p.getIn(['fotos', 0]) || '';
            if (foto && foto.charAt(0) !== '/') foto = '/' + foto;
            var linea = (p.get('numero') || '') + ' ' + (p.get('nombre') || '') + ' — ' + (p.get('categoria') || '') + ' — ' + (p.get('precio') || '') + ' — ' + (p.get('descripcion') || '');
            return h('div', {
              key: i,
              style: {
                display: 'flex',
                alignItems: 'center',
                gap: '12px',
                borderBottom: '1px solid #ddd',
                padding: '8px 0'
              }
            }, [
              h('img', {
                key: 'img',
                src: foto,
                style: { width: '45px', height: '45px', objectFit: 'cover', borderRadius: '4px', flexShrink: 0 }
              }),
              h('div', { key: 'info', style: { fontSize: '13px' } }, linea)
            ]);
          }).toArray()
        );
      }
    });
    CMS.registerPreviewTemplate('catalogo', CatalogoPreview);
  </script>
  <script>
    var TRADUCCIONES = {
      'Ahorrar': 'Guardar',
      'Save': 'Guardar',
      'Guardar': 'Guardar',
      'Delete entry': 'Eliminar catálogo',
      'Delete published entry': 'Eliminar catálogo',
      'Eliminar entrada': 'Eliminar catálogo',
      'Eliminar entrada publicada': 'Eliminar catálogo',
      'Published': 'Publicado',
      'Publicado': 'Publicado',
      'CHANGES SAVED': 'CAMBIOS GUARDADOS',
      'CAMBIOS GUARDADOS': 'CAMBIOS GUARDADOS',
      'Add gorras': 'Agregar gorras',
      'Agregar gorras': 'Agregar gorras',
      'Check for Preview': 'Comprobar vista previa',
      'Comprobar la vista previa': 'Comprobar vista previa',
      'Escritos en la colección de Gorras': 'En Catálogo de Gorras',
      'Writing in Gorras collection': 'En Catálogo de Gorras',
      'En Catálogo de Gorras': 'En Catálogo de Gorras',
      'Contents': 'Contenido',
      'Workflow': 'Flujo editorial',
      'Media': 'Archivos',
      'Editorial Workflow': 'Flujo editorial',
      'New Post': 'Nueva gorra',
      'Drafts': 'Borradores',
      'In Review': 'En revisión',
      'Ready': 'Listo',
      'Quick add': 'Agregar rápido'
    };

    function aplicarTraducciones(nodo) {
      var caminar = document.createTreeWalker(nodo, NodeFilter.SHOW_TEXT, null);
      var textoActual;
      while ((textoActual = caminar.nextNode())) {
        var limpio = textoActual.nodeValue.trim();
        if (TRADUCCIONES.hasOwnProperty(limpio) && textoActual.nodeValue !== TRADUCCIONES[limpio]) {
          textoActual.nodeValue = textoActual.nodeValue.replace(limpio, TRADUCCIONES[limpio]);
        }
      }
    }

    var observadorTextos = new MutationObserver(function() {
      aplicarTraducciones(document.body);
    });
    observadorTextos.observe(document.body, { childList: true, subtree: true, characterData: true });
    aplicarTraducciones(document.body);
    setInterval(function() { aplicarTraducciones(document.body); }, 800);
  </script>
  <script>
    function crearBotonInicio() {
      if (document.getElementById('boton-inicio-panel')) return;
      var boton = document.createElement('a');
      boton.id = 'boton-inicio-panel';
      boton.href = '/admin/#/collections/productos/entries/catalogo';
      boton.textContent = '← Volver al catálogo';
      boton.style.position = 'fixed';
      boton.style.bottom = '18px';
      boton.style.right = '18px';
      boton.style.zIndex = '9999';
      boton.style.background = '#3B2A2C';
      boton.style.color = '#FBF3F0';
      boton.style.padding = '12px 18px';
      boton.style.borderRadius = '30px';
      boton.style.fontFamily = 'sans-serif';
      boton.style.fontSize = '14px';
      boton.style.fontWeight = 'bold';
      boton.style.textDecoration = 'none';
      boton.style.boxShadow = '0 6px 16px rgba(0,0,0,0.3)';
      document.body.appendChild(boton);
    }
    crearBotonInicio();
    setInterval(crearBotonInicio, 1000);
  </script>
</body>
</html>
