<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel - Obras hechas con Amor</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  <script>
    var CatalogoPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var productos = entry.getIn(['data', 'productos']);
        if (!productos) return h('div', {}, 'Sin productos');
        return h('div', { style: { fontFamily: 'sans-serif', padding: '10px' } },
          productos.map(function(p, i) {
            var foto = p.getIn(['fotos', 0]) || '';
            if (foto && foto.charAt(0) !== '/') foto = '/' + foto;
            var linea = (p.get('numero') || '') + ' ' + (p.get('nombre') || '') + ' — ' + (p.get('categoria') || '') + ' — ' + (p.get('precio') || '') + ' — ' + (p.get('descripcion') || '');
            return h('div', {
              key: i,
              style: {
                display: 'flex',
                alignItems: 'center',
                gap: '12px',
                borderBottom: '1px solid #ddd',
                padding: '8px 0'
              }
            }, [
              h('img', {
                key: 'img',
                src: foto,
                style: { width: '45px', height: '45px', objectFit: 'cover', borderRadius: '4px', flexShrink: 0 }
              }),
              h('div', { key: 'info', style: { fontSize: '13px' } }, linea)
            ]);
          }).toArray()
        );
      }
    });
    CMS.registerPreviewTemplate('catalogo', CatalogoPreview);
    CMS.registerLocale('en', { editor: { editorToolbar: { deleteEntry: 'Eliminar catálogo' } } });
  </script>
</body>
</html>
